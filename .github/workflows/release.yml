name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format, e.g., 2.1.0 for JSONata 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  checks: read

jobs:
  check-quality:
    name: Check Required Workflows
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check Security and Code Quality workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get current commit SHA
          COMMIT_SHA="${{ github.sha }}"

          echo "Checking required workflows for commit: $COMMIT_SHA"

          # Check Security Scanning workflow
          SECURITY_STATUS=$(gh api \
            "/repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Security Summary") | .conclusion' \
            || echo "not_found")

          # Check Code Quality workflow
          LINT_STATUS=$(gh api \
            "/repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Lint Summary") | .conclusion' \
            || echo "not_found")

          echo "Security workflow status: $SECURITY_STATUS"
          echo "Code Quality workflow status: $LINT_STATUS"

          # Check if workflows passed
          FAILED=0

          if [ "$SECURITY_STATUS" != "success" ]; then
            echo "::error::Security Scanning workflow has not passed (status: $SECURITY_STATUS)"
            FAILED=1
          fi

          if [ "$LINT_STATUS" != "success" ]; then
            echo "::error::Code Quality workflow has not passed (status: $LINT_STATUS)"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo "::error::Required workflows must pass before release. Run security and lint workflows on this commit first."
            exit 1
          fi

          echo "✅ All required workflows passed"

  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    needs: check-quality
    timeout-minutes: 5

    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Validate format X.Y.Z (semver)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Expected X.Y.Z (e.g., 2.1.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Release version: $VERSION"

  update-version:
    name: Update Version Files
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Cargo.toml
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

          echo "Updated Cargo.toml:"
          grep "^version = " Cargo.toml

      - name: Update pyproject.toml
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

          echo "Updated pyproject.toml:"
          grep "^version = " pyproject.toml

      - name: Update Cargo.lock
        run: |
          cargo update -p jsonata-core

      - name: Bump CHANGELOG.md
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"

          # Re-run safety, matching "Commit version bump" below: if a prior attempt
          # at this same version already flushed [Unreleased] into [$VERSION] and
          # pushed it, [Unreleased] is now legitimately empty - re-running the bump
          # script would fail loudly on that (by design, for the FIRST run), so skip
          # entirely once the version's own entry already exists.
          if grep -q "^## \[$VERSION\] - " CHANGELOG.md; then
            echo "CHANGELOG.md already has a [$VERSION] entry - skipping (re-run case)"
          else
            ./scripts/bump-changelog.sh "$VERSION"
          fi

          echo "Updated CHANGELOG.md:"
          head -30 CHANGELOG.md

      - name: Commit version bump
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          git add Cargo.toml pyproject.toml Cargo.lock CHANGELOG.md

          # Skip commit if nothing changed (re-run case)
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION, skipping commit"
          else
            git commit -m "chore: Bump version to $VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi

          # Create the tag if it doesn't exist yet. If it already exists, verify it points at
          # the commit this run is actually releasing before treating that as a no-op --
          # silently reusing a tag that predates this run's commit is exactly how three
          # separate release-benchmark runs ended up measuring stale code in the past: the
          # workflow's job graph and matrix come from whatever ref triggered this dispatch, but
          # every build/test/benchmark job checks out `refs/tags/v$VERSION` explicitly, so a
          # stale tag silently overrides the intent of the dispatch.
          CURRENT_SHA=$(git rev-parse HEAD)
          REMOTE_REFS=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" || true)

          if [ -z "$REMOTE_REFS" ]; then
            echo "Tag v$VERSION does not exist yet on origin - creating it"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          else
            # Prefer the peeled (^{}) line for annotated tags -- it's the actual commit the tag
            # points at, not the tag object's own SHA.
            REMOTE_TAG_SHA=$(echo "$REMOTE_REFS" | awk '$2 ~ /\^\{\}$/ {print $1}')
            if [ -z "$REMOTE_TAG_SHA" ]; then
              REMOTE_TAG_SHA=$(echo "$REMOTE_REFS" | awk '{print $1}' | head -1)
            fi

            if [ "$REMOTE_TAG_SHA" = "$CURRENT_SHA" ]; then
              echo "Tag v$VERSION already exists and already points at the current commit ($CURRENT_SHA) - nothing to do"
            else
              echo "::error::Tag v$VERSION already exists but points at $REMOTE_TAG_SHA, not the commit this run is releasing ($CURRENT_SHA)."
              echo "::error::Building, testing, publishing, or benchmarking would silently use the stale commit instead of $CURRENT_SHA -- this has happened before."
              echo "::error::If you deliberately want to re-point v$VERSION at $CURRENT_SHA (e.g. re-running a release-time job after merging a fix on the same version), delete and recreate the tag yourself first, then re-dispatch this workflow:"
              echo "::error::  git tag -d v$VERSION && git push origin :refs/tags/v$VERSION && git tag -a v$VERSION -m 'Release v$VERSION' $CURRENT_SHA && git push origin v$VERSION"
              echo "::error::Otherwise, use a new version number for this release."
              exit 1
            fi
          fi

          echo "tag=v$VERSION" >> $GITHUB_ENV

  build-wheels:
    name: Build wheels on ${{ matrix.platform.os }} for ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [validate-version, update-version]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux
          - { os: 'Linux', runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: 'Linux', runner: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          # Windows
          - { os: 'Windows', runner: windows-latest, target: x86_64-pc-windows-msvc }
          # macOS (self-hosted Mac Mini, native ARM64 build)
          - { os: 'macOS', runner: [self-hosted, macOS, ARM64], target: aarch64-apple-darwin }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      # actions/setup-python needs sudo to run its .pkg installer, and the
      # self-hosted macOS runner has no interactive terminal for that password
      # prompt (confirmed broken: "sudo: a terminal is required to read the
      # password"). Use uv there instead -- it installs standalone Python
      # builds into a user-writable directory, no sudo required. See
      # release-macos-backfill.yml, which already uses this working pattern.
      - name: Set up Python
        if: matrix.platform.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv (macOS)
        if: matrix.platform.os == 'macOS'
        uses: astral-sh/setup-uv@v7

      - name: Install Python versions (macOS)
        if: matrix.platform.os == 'macOS'
        run: uv python install 3.10 3.11 3.12 3.13

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build wheels
        if: matrix.platform.os != 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          sccache: 'true'
          manylinux: auto

      - name: Build wheels (macOS)
        if: matrix.platform.os == 'macOS'
        run: |
          uvx maturin build --release --out dist \
            --interpreter \
            "$(uv python find 3.10)" \
            "$(uv python find 3.11)" \
            "$(uv python find 3.12)" \
            "$(uv python find 3.13)"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
          retention-days: 7

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [validate-version, update-version]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
          retention-days: 7

  test-wheels:
    name: Test wheels on ${{ matrix.platform.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    needs: build-wheels
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: 'ubuntu-latest', runner: ubuntu-latest }
          - { os: 'windows-latest', runner: windows-latest }
          - { os: 'macOS', runner: [self-hosted, macOS, ARM64] }
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      # Same sudo/no-terminal issue as build-wheels (see the comment there) --
      # actions/setup-python doesn't work on the self-hosted macOS runner.
      - name: Set up Python
        if: matrix.platform.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Python (macOS)
        if: matrix.platform.os == 'macOS'
        run: |
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Install wheel (Linux/Windows)
        if: matrix.platform.os != 'macOS'
        shell: bash
        run: |
          # --reinstall (implies --refresh) forces uv to re-read this exact
          # file instead of trusting its cache, which is keyed by filename
          # only for --find-links sources -- see the macOS comment below,
          # which is where this actually bit us (issue #45).
          uv pip install --system --reinstall --find-links dist jsonatapy
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Install wheel (macOS)
        if: matrix.platform.os == 'macOS'
        shell: bash
        run: |
          # --reinstall is required here, not just belt-and-suspenders: uv's
          # cache for --find-links (flat index) sources is keyed by filename
          # alone, not content. jsonatapy-<version>-<abi>-<platform>.whl is
          # the same filename every time this version/interpreter/platform
          # combo is built. GitHub-hosted Linux/Windows runners get a fresh
          # uv cache every job so this never bit them, but this self-hosted
          # Mac Mini's ~/.cache/uv persists across every job (and any local
          # dev/testing on the same machine) forever. Without --reinstall, a
          # wheel rebuilt with new code silently loses to a stale
          # same-version cache entry from an earlier build/dev session --
          # this is exactly what caused issue #45 (verified: the built wheel
          # was correct, `uv pip install` resolved and "installed" it in
          # ~1ms, but the parser behaved like the pre-%/@-operator code).
          uv pip install --reinstall --find-links dist jsonatapy
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Install test dependencies (Linux/Windows)
        if: matrix.platform.os != 'macOS'
        run: uv pip install --system pytest pytest-xdist

      - name: Install test dependencies (macOS)
        if: matrix.platform.os == 'macOS'
        run: uv pip install pytest pytest-xdist

      - name: Run tests
        shell: bash
        run: |
          pytest tests/python/ \
            --ignore=tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            -n auto

      - name: Run reference suite (smoke test)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            --maxfail=10 \
            -k "array-constructor"

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels]
    timeout-minutes: 10

    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="v${{ needs.validate-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          cat > changelog.md <<EOF
          ## Release $VERSION

          ### Changes

          $COMMITS

          ### Test Suite Compatibility

          See the [README](https://github.com/${{ github.repository }}#readme) for the current
          reference-suite pass count -- this changelog no longer hardcodes a number here, since a
          stale hardcoded count is exactly the kind of bug this project has previously shipped
          and had to correct.

          ### Installation

          \`\`\`bash
          pip install jsonatapy==${{ needs.validate-version.outputs.version }}
          \`\`\`

          ### Verification

          \`\`\`python
          import jsonatapy
          print(jsonatapy.__version__)  # Should print: ${{ needs.validate-version.outputs.version }}
          \`\`\`
          EOF

          # Save to output (escaped)
          echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jsonatapy/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List distribution files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
          verbose: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog, publish-pypi, publish-crates]
    if: always() && needs.test-wheels.result == 'success'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: Release v${{ needs.validate-version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            artifacts/wheels-*/*
            artifacts/sdist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Release v${{ needs.validate-version.outputs.version }} Published! 🎉

          - **Version:** ${{ needs.validate-version.outputs.version }}
          - **JSONata Compatibility:** 2.1.0 (100% test suite compatibility)
          - **PyPI:** [jsonatapy ${{ needs.validate-version.outputs.version }}](https://pypi.org/project/jsonatapy/${{ needs.validate-version.outputs.version }}/)
          - **GitHub:** [Release v${{ needs.validate-version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate-version.outputs.version }})

          ## Installation

          \`\`\`bash
          pip install jsonatapy==${{ needs.validate-version.outputs.version }}
          \`\`\`
          EOF

  dry-run-summary:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog]
    if: github.event.inputs.dry_run == 'true'
    timeout-minutes: 5

    steps:
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Display summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Dry Run Complete ✅

          This was a **dry run** - no publishing occurred.

          ## Version Information
          - **Version:** ${{ needs.validate-version.outputs.version }}
          - **JSONata Compatibility:** 2.1.0 (100% test suite compatibility)

          ## Build Results
          - ✅ Wheels built successfully
          - ✅ Tests passed
          - ✅ Changelog generated

          ## Changelog Preview

          EOF

          cat changelog.md >> $GITHUB_STEP_SUMMARY

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## Next Steps

          To publish this release, run the workflow again without the dry_run flag.
          EOF

  benchmark-and-record:
    name: Benchmark and Record Release Performance
    runs-on: ubuntu-latest
    needs: [validate-version, create-github-release]
    if: needs.create-github-release.result == 'success' && github.event.inputs.dry_run != 'true'
    timeout-minutes: 90

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmarks/javascript/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: |
          uv pip install --system --upgrade maturin rich matplotlib pandas jsonata

      - name: Install JavaScript dependencies
        run: |
          cd benchmarks/javascript
          npm install jsonata@latest

      - name: Build jsonata-rs comparison binary
        run: |
          cd benchmarks/rust
          cargo update -p jsonata-rs
          cargo build --release

      - name: Build jsonatapy (optimized)
        run: |
          maturin build --release --out dist
          uv pip install --system --reinstall --find-links dist jsonatapy

      - name: Verify installation
        run: |
          python -c "import jsonatapy; print(f'jsonatapy version: {jsonatapy.__version__}')"
          python -c "import jsonata; print('jsonata-python installed')"
          cd benchmarks/javascript && node -e "const jsonata = require('jsonata'); console.log('jsonata installed');"
          test -x ../rust/target/release/jsonata-rs-bench && echo "jsonata-rs-bench built"

      - name: Run benchmark suite
        id: run_benchmark
        run: |
          cd benchmarks
          # Note: benchmark.py has no --iterations flag (each test hardcodes its
          # own iteration count internally) - do not add one here, it would be
          # silently ignored. This step takes ~40 minutes because it includes
          # jsonata-python, which can be 2,300-69,000x slower than JS on some
          # tests; that's expected and accounted for in this job's timeout.
          python python/benchmark.py
          RESULTS_FILE=$(ls -t results/benchmark_results_*.json | head -1)
          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT
          echo "Benchmark results saved to: $RESULTS_FILE"

      - name: Download previous release baseline
        id: baseline
        continue-on-error: true
        run: |
          mkdir -p benchmarks/baseline
          VERSION="${{ needs.validate-version.outputs.version }}"
          git fetch origin benchmark-data

          # If results/v$VERSION.json already exists on benchmark-data, this
          # version was already benchmarked and recorded by an earlier run -
          # i.e. this run is a `gh run rerun` (or similar retry) of a release
          # that already completed, not a genuinely new release. latest.json
          # at this point holds that earlier run's numbers for the SAME
          # version/commit, so comparing against it would be v$VERSION vs
          # v$VERSION on a shared runner: pure noise, not a real signal. This
          # happened 3 times for v2.1.6 in one session and produced two bogus
          # "regression" issues (txjmb/jsonata-core#48, #51) before this guard
          # existed.
          if git show FETCH_HEAD:results/v${VERSION}.json > /dev/null 2>&1; then
            echo "already_recorded=true" >> $GITHUB_OUTPUT
            echo "v${VERSION} was already recorded to benchmark-data by an earlier run - skipping comparison to avoid comparing this version against itself"
          else
            echo "already_recorded=false" >> $GITHUB_OUTPUT
          fi

          if git show FETCH_HEAD:results/latest.json > benchmarks/baseline/baseline.json.tmp; then
            mv benchmarks/baseline/baseline.json.tmp benchmarks/baseline/baseline.json
            echo "has_baseline=true" >> $GITHUB_OUTPUT
            echo "Baseline results downloaded from benchmark-data"
          else
            rm -f benchmarks/baseline/baseline.json.tmp
            echo "has_baseline=false" >> $GITHUB_OUTPUT
            echo "No baseline results found (this is the first release recorded to benchmark-data)"
          fi

      - name: Compare with previous release
        id: compare
        if: steps.baseline.outputs.has_baseline == 'true' && steps.baseline.outputs.already_recorded != 'true'
        run: |
          cd benchmarks
          python python/compare.py baseline/baseline.json "${{ steps.run_benchmark.outputs.results_file }}"

      - name: Record results to benchmark-data
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          RESULTS_FILE="$(pwd)/benchmarks/${{ steps.run_benchmark.outputs.results_file }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read from FETCH_HEAD, not origin/benchmark-data - see the comment in
          # the "Download previous release baseline" step above for why.
          git fetch origin benchmark-data
          git worktree add -B benchmark-data /tmp/benchmark-data FETCH_HEAD

          mkdir -p /tmp/benchmark-data/results
          cp "$RESULTS_FILE" "/tmp/benchmark-data/results/v${VERSION}.json"
          # latest.json always becomes this release's results, even if this
          # release regressed - so a regression only opens an issue once (at
          # the release that introduced it), not on every subsequent release
          # compared against it. This matches "one fresh issue per release"
          # rather than ongoing alerting for an unfixed regression.
          cp "$RESULTS_FILE" "/tmp/benchmark-data/results/latest.json"

          cd /tmp/benchmark-data
          git add "results/v${VERSION}.json" results/latest.json
          git commit -m "chore: record benchmark results for v${VERSION}"
          git push origin HEAD:benchmark-data

      - name: Open regression issue
        if: steps.compare.outputs.regression_detected == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const comparison = JSON.parse(fs.readFileSync('benchmarks/comparison.json', 'utf8'));
            const version = '${{ needs.validate-version.outputs.version }}';

            let body = `Release v${version} is more than 10% slower than the previous release on the following benchmarks:\n\n`;
            body += '| Test | Previous | Current | Change |\n';
            body += '|------|----------|---------|--------|\n';
            for (const r of comparison.regressions) {
              body += `| ${r.name} | ${r.baseline_ms.toFixed(2)}ms | ${r.current_ms.toFixed(2)}ms | **${r.change_pct.toFixed(1)}%** |\n`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance regression detected in v${version}`,
              body: body,
            });

  deploy-release-docs:
    name: Deploy Release Documentation
    runs-on: ubuntu-latest
    needs: [validate-version, create-github-release]
    if: needs.create-github-release.result == 'success' && github.event.inputs.dry_run != 'true'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material pymdown-extensions mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          mike deploy "$MAJOR_MINOR" stable --update-aliases --push
          mike set-default stable --push
