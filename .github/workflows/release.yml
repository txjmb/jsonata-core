name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver format, e.g., 2.1.0 for JSONata 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  checks: read

jobs:
  check-quality:
    name: Check Required Workflows
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check Security and Code Quality workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get current commit SHA
          COMMIT_SHA="${{ github.sha }}"

          echo "Checking required workflows for commit: $COMMIT_SHA"

          # Check Security Scanning workflow
          SECURITY_STATUS=$(gh api \
            "/repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Security Summary") | .conclusion' \
            || echo "not_found")

          # Check Code Quality workflow
          LINT_STATUS=$(gh api \
            "/repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Lint Summary") | .conclusion' \
            || echo "not_found")

          echo "Security workflow status: $SECURITY_STATUS"
          echo "Code Quality workflow status: $LINT_STATUS"

          # Check if workflows passed
          FAILED=0

          if [ "$SECURITY_STATUS" != "success" ]; then
            echo "::error::Security Scanning workflow has not passed (status: $SECURITY_STATUS)"
            FAILED=1
          fi

          if [ "$LINT_STATUS" != "success" ]; then
            echo "::error::Code Quality workflow has not passed (status: $LINT_STATUS)"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo "::error::Required workflows must pass before release. Run security and lint workflows on this commit first."
            exit 1
          fi

          echo "✅ All required workflows passed"

  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    needs: check-quality
    timeout-minutes: 5

    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Validate format X.Y.Z (semver)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Expected X.Y.Z (e.g., 2.1.0)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Release version: $VERSION"

  update-version:
    name: Update Version Files
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Cargo.toml
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

          echo "Updated Cargo.toml:"
          grep "^version = " Cargo.toml

      - name: Update pyproject.toml
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

          echo "Updated pyproject.toml:"
          grep "^version = " pyproject.toml

      - name: Update Cargo.lock
        run: |
          cargo update -p jsonata-core

      - name: Commit version bump
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          git add Cargo.toml pyproject.toml Cargo.lock

          # Skip commit if nothing changed (re-run case)
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION, skipping commit"
          else
            git commit -m "chore: Bump version to $VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi

          # Create tag only if it doesn't already exist
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            echo "Tag v$VERSION already exists, skipping"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

          echo "tag=v$VERSION" >> $GITHUB_ENV

  build-wheels:
    name: Build wheels on ${{ matrix.platform.os }} for ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [validate-version, update-version]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux
          - { os: 'Linux', runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: 'Linux', runner: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          # Windows
          - { os: 'Windows', runner: windows-latest, target: x86_64-pc-windows-msvc }
          # macOS (self-hosted Mac Mini, native ARM64 build)
          - { os: 'macOS', runner: [self-hosted, macOS, ARM64], target: aarch64-apple-darwin }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
          retention-days: 7

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [validate-version, update-version]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
          retention-days: 7

  test-wheels:
    name: Test wheels on ${{ matrix.platform.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    needs: build-wheels
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: 'ubuntu-latest', runner: ubuntu-latest }
          - { os: 'windows-latest', runner: windows-latest }
          - { os: 'macOS', runner: [self-hosted, macOS, ARM64] }
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          uv pip install --system --find-links dist jsonatapy
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-xdist

      - name: Run tests
        shell: bash
        run: |
          pytest tests/python/ \
            --ignore=tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            -n auto

      - name: Run reference suite (smoke test)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            --maxfail=10 \
            -k "array-constructor"

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels]
    timeout-minutes: 10

    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="v${{ needs.validate-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          cat > changelog.md <<EOF
          ## Release $VERSION

          This release implements JSONata 2.1.0 specification with full compatibility.

          ### Changes

          $COMMITS

          ### Test Suite Compatibility
          - 1258/1258 reference tests passing (100%)

          ### Installation

          \`\`\`bash
          pip install jsonatapy==${{ needs.validate-version.outputs.version }}
          \`\`\`

          ### Verification

          \`\`\`python
          import jsonatapy
          print(jsonatapy.__version__)  # Should print: ${{ needs.validate-version.outputs.version }}
          \`\`\`
          EOF

          # Save to output (escaped)
          echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jsonatapy/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List distribution files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
          verbose: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog, publish-pypi, publish-crates]
    if: always() && needs.test-wheels.result == 'success'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: Release v${{ needs.validate-version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            artifacts/wheels-*/*
            artifacts/sdist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Release v${{ needs.validate-version.outputs.version }} Published! 🎉

          - **Version:** ${{ needs.validate-version.outputs.version }}
          - **JSONata Compatibility:** 2.1.0 (100% test suite compatibility)
          - **PyPI:** [jsonatapy ${{ needs.validate-version.outputs.version }}](https://pypi.org/project/jsonatapy/${{ needs.validate-version.outputs.version }}/)
          - **GitHub:** [Release v${{ needs.validate-version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate-version.outputs.version }})

          ## Installation

          \`\`\`bash
          pip install jsonatapy==${{ needs.validate-version.outputs.version }}
          \`\`\`
          EOF

  dry-run-summary:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: [validate-version, test-wheels, generate-changelog]
    if: github.event.inputs.dry_run == 'true'
    timeout-minutes: 5

    steps:
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Display summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Dry Run Complete ✅

          This was a **dry run** - no publishing occurred.

          ## Version Information
          - **Version:** ${{ needs.validate-version.outputs.version }}
          - **JSONata Compatibility:** 2.1.0 (100% test suite compatibility)

          ## Build Results
          - ✅ Wheels built successfully
          - ✅ Tests passed
          - ✅ Changelog generated

          ## Changelog Preview

          EOF

          cat changelog.md >> $GITHUB_STEP_SUMMARY

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## Next Steps

          To publish this release, run the workflow again without the dry_run flag.
          EOF

  benchmark-and-record:
    name: Benchmark and Record Release Performance
    runs-on: ubuntu-latest
    needs: [validate-version, create-github-release]
    if: needs.create-github-release.result == 'success' && github.event.inputs.dry_run != 'true'
    timeout-minutes: 90

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: benchmarks/javascript/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: |
          uv pip install --system --upgrade maturin rich matplotlib pandas jsonata

      - name: Install JavaScript dependencies
        run: |
          cd benchmarks/javascript
          npm install jsonata@latest

      - name: Build jsonata-rs comparison binary
        run: |
          cd benchmarks/rust
          cargo update -p jsonata-rs
          cargo build --release

      - name: Build jsonatapy (optimized)
        run: |
          maturin build --release --out dist
          uv pip install --system --find-links dist jsonatapy

      - name: Verify installation
        run: |
          python -c "import jsonatapy; print(f'jsonatapy version: {jsonatapy.__version__}')"
          python -c "import jsonata; print('jsonata-python installed')"
          cd benchmarks/javascript && node -e "const jsonata = require('jsonata'); console.log('jsonata installed');"
          test -x ../rust/target/release/jsonata-rs-bench && echo "jsonata-rs-bench built"

      - name: Run benchmark suite
        id: run_benchmark
        run: |
          cd benchmarks
          # Note: benchmark.py has no --iterations flag (each test hardcodes its
          # own iteration count internally) - do not add one here, it would be
          # silently ignored. This step takes ~40 minutes because it includes
          # jsonata-python, which can be 2,300-69,000x slower than JS on some
          # tests; that's expected and accounted for in this job's timeout.
          python python/benchmark.py
          RESULTS_FILE=$(ls -t results/benchmark_results_*.json | head -1)
          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT
          echo "Benchmark results saved to: $RESULTS_FILE"

      - name: Download previous release baseline
        id: baseline
        continue-on-error: true
        run: |
          mkdir -p benchmarks/baseline
          git fetch origin benchmark-data

          if git show FETCH_HEAD:results/latest.json > benchmarks/baseline/baseline.json.tmp; then
            mv benchmarks/baseline/baseline.json.tmp benchmarks/baseline/baseline.json
            echo "has_baseline=true" >> $GITHUB_OUTPUT
            echo "Baseline results downloaded from benchmark-data"
          else
            rm -f benchmarks/baseline/baseline.json.tmp
            echo "has_baseline=false" >> $GITHUB_OUTPUT
            echo "No baseline results found (this is the first release recorded to benchmark-data)"
          fi

      - name: Compare with previous release
        id: compare
        if: steps.baseline.outputs.has_baseline == 'true'
        run: |
          cd benchmarks
          python python/compare.py baseline/baseline.json "${{ steps.run_benchmark.outputs.results_file }}"

      - name: Record results to benchmark-data
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          RESULTS_FILE="$(pwd)/benchmarks/${{ steps.run_benchmark.outputs.results_file }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read from FETCH_HEAD, not origin/benchmark-data - see the comment in
          # the "Download previous release baseline" step above for why.
          git fetch origin benchmark-data
          git worktree add -B benchmark-data /tmp/benchmark-data FETCH_HEAD

          mkdir -p /tmp/benchmark-data/results
          cp "$RESULTS_FILE" "/tmp/benchmark-data/results/v${VERSION}.json"
          # latest.json always becomes this release's results, even if this
          # release regressed - so a regression only opens an issue once (at
          # the release that introduced it), not on every subsequent release
          # compared against it. This matches "one fresh issue per release"
          # rather than ongoing alerting for an unfixed regression.
          cp "$RESULTS_FILE" "/tmp/benchmark-data/results/latest.json"

          cd /tmp/benchmark-data
          git add "results/v${VERSION}.json" results/latest.json
          git commit -m "chore: record benchmark results for v${VERSION}"
          git push origin HEAD:benchmark-data

      - name: Open regression issue
        if: steps.compare.outputs.regression_detected == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const comparison = JSON.parse(fs.readFileSync('benchmarks/comparison.json', 'utf8'));
            const version = '${{ needs.validate-version.outputs.version }}';

            let body = `Release v${version} is more than 10% slower than the previous release on the following benchmarks:\n\n`;
            body += '| Test | Previous | Current | Change |\n';
            body += '|------|----------|---------|--------|\n';
            for (const r of comparison.regressions) {
              body += `| ${r.name} | ${r.baseline_ms.toFixed(2)}ms | ${r.current_ms.toFixed(2)}ms | **${r.change_pct.toFixed(1)}%** |\n`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance regression detected in v${version}`,
              body: body,
            });

  deploy-release-docs:
    name: Deploy Release Documentation
    runs-on: ubuntu-latest
    needs: [validate-version, create-github-release]
    if: needs.create-github-release.result == 'success' && github.event.inputs.dry_run != 'true'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.validate-version.outputs.version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material pymdown-extensions mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          mike deploy "$MAJOR_MINOR" stable --update-aliases --push
          mike set-default stable --push
