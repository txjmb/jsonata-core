name: TEST - Benchmark on self-hosted macOS runner

# THROWAWAY validation workflow - not part of the release pipeline. Exists
# only to validate that release.yml's "Benchmark and Record Release
# Performance" job would actually work on the self-hosted Mac Mini runner
# (runs-on: [self-hosted, macOS, ARM64]) before migrating it there for real.
# Does NOT record anything to the benchmark-data branch and does NOT open
# regression issues. Delete this file once validated.

on:
  workflow_dispatch:

jobs:
  test-benchmark-macos:
    name: Test benchmark suite on Mac Mini
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      # Same sudo/no-terminal issue noted elsewhere in release.yml --
      # actions/setup-python doesn't work on this self-hosted runner.
      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Python (macOS)
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: |
          uv pip install --upgrade maturin rich matplotlib pandas jsonata

      - name: Build jsonata-rs comparison binary
        run: |
          cd benchmarks/rust
          cargo update -p jsonata-rs
          cargo build --release

      - name: Build jsonatapy (optimized)
        run: |
          maturin build --release --out dist
          uv pip install --reinstall --find-links dist jsonatapy

      - name: Verify installation
        run: |
          python -c "import jsonatapy; print(f'jsonatapy version: {jsonatapy.__version__}')"
          python -c "import jsonata; print('jsonata-python installed')"
          test -x benchmarks/rust/target/release/jsonata-rs-bench && echo "jsonata-rs-bench built"
          command -v node >/dev/null 2>&1 && echo "node found (unexpected - not needed, just noting)" || echo "node not found (expected - JS comparison will be skipped, this is fine, it's not used by regression detection)"

      - name: Run benchmark suite
        run: |
          cd benchmarks
          python python/benchmark.py
          RESULTS_FILE=$(ls -t results/benchmark_results_*.json | head -1)
          echo "Benchmark results saved to: $RESULTS_FILE"
          echo "--- Summary ---"
          python3 -c "
          import json
          with open('$RESULTS_FILE') as f:
              data = json.load(f)
          results = data.get('results', data) if isinstance(data, dict) else data
          if isinstance(data, dict) and 'results' in data:
              results = data['results']
          print(f'Total test results: {len(results)}')
          missing_jsonatapy = [r['name'] for r in results if not r.get('jsonatapy_ms')]
          if missing_jsonatapy:
              print(f'WARNING - tests missing jsonatapy_ms: {missing_jsonatapy}')
          else:
              print('All tests have a jsonatapy_ms value (this is what the real regression check reads)')
          "

      - name: Upload results as artifact
        uses: actions/upload-artifact@v8
        with:
          name: test-benchmark-macos-results
          path: benchmarks/results/benchmark_results_*.json
          retention-days: 7
