name: Backfill macOS Release Wheel

# One-off/repeatable workflow to build a macOS wheel for an *already-published*
# release (on the self-hosted Mac Mini runner) and add it to that release on
# PyPI and GitHub, without re-running the full release.yml pipeline (which
# would fail: crates.io rejects re-publishing an existing version, and PyPI's
# publish step has skip-existing: false).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-released version to add a macOS wheel for (e.g. 2.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-wheel:
    name: Build macOS wheel (aarch64, self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          submodules: true

      - name: Debug runner environment (temporary, no secret values printed)
        run: |
          echo "RUNNER_TOOL_CACHE=[$RUNNER_TOOL_CACHE]"
          if [ -z ${AGENT_TOOLSDIRECTORY+x} ]; then
            echo "AGENT_TOOLSDIRECTORY is UNSET"
          else
            echo "AGENT_TOOLSDIRECTORY=[$AGENT_TOOLSDIRECTORY] (set, even if shown empty)"
          fi
          echo "HOME=[$HOME]"
          echo "whoami: $(whoami)"
          echo "RUNNER_WORKSPACE=[$RUNNER_WORKSPACE]"
          echo "--- what the bundled python installer script would compute ---"
          if [ -z ${AGENT_TOOLSDIRECTORY+x} ]; then
            echo "would use RUNNER_TOOL_CACHE branch -> TOOLCACHE_ROOT=[$RUNNER_TOOL_CACHE]"
          else
            echo "would use AGENT_TOOLSDIRECTORY branch -> TOOLCACHE_ROOT=[$AGENT_TOOLSDIRECTORY]"
          fi
          echo "--- looking for .env files near common runner install paths (names only, plus whether they define RUNNER_TOOL_CACHE - no values) ---"
          for d in "$HOME" "$HOME"/actions-runner "$HOME"/source/jsonatapy/actions-runner ~/*/actions-runner ~/*/*/actions-runner; do
            if [ -f "$d/.env" ]; then
              echo "found: $d/.env"
              grep -c '^RUNNER_TOOL_CACHE=' "$d/.env" 2>/dev/null && echo "  (defines RUNNER_TOOL_CACHE)" || echo "  (does NOT define RUNNER_TOOL_CACHE)"
              grep -c '^AGENT_TOOLSDIRECTORY=' "$d/.env" 2>/dev/null && echo "  (defines AGENT_TOOLSDIRECTORY)" || echo "  (does NOT define AGENT_TOOLSDIRECTORY)"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - name: List built wheels
        run: ls -lh dist/

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist
          retention-days: 7

  test-macos-wheel:
    name: Test macOS wheel with Python ${{ matrix.python }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: build-macos-wheel
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist

      - name: Install wheel
        run: |
          uv pip install --system --find-links dist jsonatapy
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-xdist

      - name: Run tests
        run: |
          pytest tests/python/ \
            --ignore=tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            -n auto

      - name: Run reference suite (smoke test)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            --maxfail=10 \
            -k "array-constructor"

  publish-macos-wheel:
    name: Publish macOS wheel to PyPI and attach to release
    runs-on: ubuntu-latest
    needs: test-macos-wheel
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jsonatapy/

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist

      - name: List distribution files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

      - name: Attach wheel to existing GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
