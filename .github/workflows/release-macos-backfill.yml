name: Backfill Release Wheels

# Repeatable workflow that builds wheels for an *already-published* release
# and adds them to that release on PyPI and GitHub, without re-running the full
# release.yml pipeline (which would fail: crates.io rejects re-publishing an
# existing version, and release.yml's PyPI step has skip-existing: false).
#
# Typical uses:
#   - A new CPython came out after a release: python_versions='3.15'
#   - A platform's build failed during the release: platforms='macOS', with
#     the release's full python_versions list
#
# PyPI accepts new files for an existing version as long as each filename is
# new, and skip-existing below means a wheel that is already there is left
# alone rather than failing the run. The sdist is never rebuilt here.
#
# The filename is historical (this started as a macOS-only backfill). Keep it:
# PyPI Trusted Publishing is registered per workflow filename (owner=txjmb,
# repo=jsonata-core, workflow=release-macos-backfill.yml, environment=pypi),
# so renaming the file would need a new registration on pypi.org.
#
# The build steps mirror release.yml's build-wheels job. Keep the two in step.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-released version to add wheels to (e.g. 2.2.17). Builds from tag v<version>.'
        required: true
        type: string
      python_versions:
        description: 'Space-separated CPython versions to build (e.g. "3.14 3.15")'
        required: true
        type: string
        default: '3.14 3.15'
      platforms:
        description: 'Space-separated platforms to build: any of Linux-x86_64 Linux-aarch64 Windows macOS'
        required: true
        type: string
        default: 'Linux-x86_64 Linux-aarch64 Windows macOS'
      dry_run:
        description: 'Dry run (build and test, skip publishing)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan backfill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - name: Validate inputs and build matrices
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PYTHONS: ${{ inputs.python_versions }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 2.2.17, got '$VERSION'"
            exit 1
          fi
          for v in $PYTHONS; do
            if ! [[ "$v" =~ ^3\.[0-9]+$ ]]; then
              echo "::error::python_versions entries must look like 3.14, got '$v'"
              exit 1
            fi
          done
          python3 - <<'EOF'
          import json, os
          pythons = os.environ["PYTHONS"].split()
          wanted = os.environ["PLATFORMS"].split()
          # Same platform table as release.yml's build-wheels matrix.
          table = {
              "Linux-x86_64": {"os": "Linux", "runner": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "manylinux": "auto"},
              "Linux-aarch64": {"os": "Linux", "runner": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu", "manylinux": "2_28"},
              "Windows": {"os": "Windows", "runner": "windows-latest", "target": "x86_64-pc-windows-msvc", "manylinux": "auto"},
              "macOS": {"os": "macOS", "runner": ["self-hosted", "macOS", "ARM64"], "target": "aarch64-apple-darwin", "manylinux": "auto"},
          }
          unknown = [p for p in wanted if p not in table]
          if unknown or not wanted or not pythons:
              raise SystemExit(f"::error::bad inputs: unknown platforms {unknown}, platforms {wanted}, pythons {pythons}")
          build = [table[p] for p in wanted]
          # Wheels can only be tested on the runner type that can run them;
          # Linux aarch64 is cross-compiled and is not tested (as in release.yml).
          test_platforms = []
          for p in wanted:
              if p == "Linux-x86_64":
                  test_platforms.append({"os": "ubuntu-latest", "runner": "ubuntu-latest"})
              elif p == "Windows":
                  test_platforms.append({"os": "windows-latest", "runner": "windows-latest"})
              elif p == "macOS":
                  test_platforms.append({"os": "macOS", "runner": ["self-hosted", "macOS", "ARM64"]})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"build_matrix={json.dumps({'platform': build})}\n")
              out.write(f"test_matrix={json.dumps({'platform': test_platforms, 'python': pythons} if test_platforms else {})}\n")
          print("pythons:", pythons)
          print("build:", json.dumps(build, indent=2))
          print("test platforms:", json.dumps(test_platforms, indent=2))
          EOF

  build-wheels:
    name: Build wheels on ${{ matrix.platform.os }} for ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    needs: plan
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          submodules: true

      # Windows: maturin-action builds on the host, so every requested
      # interpreter has to be installed there. setup-python takes one version
      # per line.
      - name: List interpreters for setup-python
        id: pylist
        if: matrix.platform.os != 'macOS'
        shell: bash
        env:
          PYTHONS: ${{ inputs.python_versions }}
        run: |
          {
            echo "versions<<PYLIST_EOF"
            for v in $PYTHONS; do echo "$v"; done
            echo "PYLIST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: matrix.platform.os != 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pylist.outputs.versions }}

      # actions/setup-python needs sudo on the self-hosted macOS runner, which
      # has no terminal for the password prompt. uv installs standalone Python
      # builds into a user-writable directory instead (see release.yml).
      - name: Install uv (macOS)
        if: matrix.platform.os == 'macOS'
        uses: astral-sh/setup-uv@v7

      - name: Install Python versions (macOS)
        if: matrix.platform.os == 'macOS'
        env:
          PYTHONS: ${{ inputs.python_versions }}
        run: uv python install $PYTHONS

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build wheels
        if: matrix.platform.os != 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ inputs.python_versions }}
          sccache: 'true'
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Build wheels (macOS)
        if: matrix.platform.os == 'macOS'
        env:
          PYTHONS: ${{ inputs.python_versions }}
        run: |
          set -euo pipefail
          interpreters=()
          for v in $PYTHONS; do interpreters+=("$(uv python find "$v")"); done
          uvx maturin build --release --out dist --interpreter "${interpreters[@]}"

      - name: List built wheels
        shell: bash
        run: ls -lh dist/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
          retention-days: 7

  test-wheels:
    name: Test wheels on ${{ matrix.platform.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [plan, build-wheels]
    if: needs.plan.outputs.test_matrix != '{}'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}

    steps:
      # Tests come from the release tag too, so the wheel is checked against
      # the test suite it shipped with.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          submodules: true

      - name: Set up Python
        if: matrix.platform.os != 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Python (macOS)
        if: matrix.platform.os == 'macOS'
        run: |
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # --reinstall: uv's --find-links cache is keyed by filename only, and the
      # self-hosted Mac's cache persists across jobs (issue #45, see release.yml).
      - name: Install wheel (Linux/Windows)
        if: matrix.platform.os != 'macOS'
        shell: bash
        run: |
          uv pip install --system --reinstall --find-links dist jsonatapy pytest pytest-xdist
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Install wheel (macOS)
        if: matrix.platform.os == 'macOS'
        shell: bash
        run: |
          uv pip install --reinstall --find-links dist jsonatapy pytest pytest-xdist
          python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Check the installed version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -c "import jsonatapy, os, sys; v = jsonatapy.__version__; sys.exit(0 if v == os.environ['VERSION'] else f'installed {v}, expected {os.environ[\"VERSION\"]}')"

      - name: Run tests
        shell: bash
        run: |
          pytest tests/python/ \
            --ignore=tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            -n auto

      - name: Run reference suite
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/python/test_reference_suite.py \
            --tb=short \
            --maxfail=10 \
            -n auto

  publish:
    name: Publish wheels to PyPI and attach to release
    runs-on: ubuntu-latest
    needs: [plan, build-wheels, test-wheels]
    # test-wheels is skipped when only untestable platforms were requested.
    if: >-
      !cancelled() && !inputs.dry_run &&
      needs.build-wheels.result == 'success' &&
      (needs.test-wheels.result == 'success' || needs.test-wheels.result == 'skipped')
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jsonatapy/${{ inputs.version }}/

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Check every wheel is for the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              jsonatapy-"$VERSION"-*.whl) ;;
              *) echo "::error::unexpected file $f"; exit 1 ;;
            esac
          done

      # Same credentials as release.yml: the API token when that secret is set,
      # otherwise Trusted Publishing for this workflow's filename.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

      - name: Attach wheels to existing GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
