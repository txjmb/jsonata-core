name: Backfill macOS Release Wheel

# One-off/repeatable workflow to build a macOS wheel for an *already-published*
# release (on the self-hosted Mac Mini runner) and add it to that release on
# PyPI and GitHub, without re-running the full release.yml pipeline (which
# would fail: crates.io rejects re-publishing an existing version, and PyPI's
# publish step has skip-existing: false).
#
# Uses uv (not actions/setup-python) to manage Python interpreters: uv installs
# standalone Python builds into a user-writable, per-user directory with no
# sudo and no dependency on the runner's GitHub-hosted-oriented tool cache
# conventions - both of which broke on this self-hosted macOS runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-released version to add a macOS wheel for (e.g. 2.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-wheel:
    name: Build macOS wheel (aarch64, self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python versions
        run: uv python install 3.10 3.11 3.12 3.13

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build wheels
        run: |
          uvx maturin build --release --out dist \
            --interpreter \
            "$(uv python find 3.10)" \
            "$(uv python find 3.11)" \
            "$(uv python find 3.12)" \
            "$(uv python find 3.13)"

      - name: List built wheels
        run: ls -lh dist/

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist
          retention-days: 7

  test-macos-wheel:
    name: Test macOS wheel with Python ${{ matrix.python }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: build-macos-wheel
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist

      - name: Create venv and install wheel
        run: |
          uv venv --python ${{ matrix.python }} .venv
          # --reinstall (implies --refresh): this runner's uv cache persists
          # across jobs and is keyed by filename only for --find-links
          # sources, so without this flag a wheel rebuilt under the same
          # version/interpreter/platform can silently lose to a stale cache
          # entry from an earlier run -- see the matching comment in
          # release.yml (issue #45).
          uv pip install --python .venv/bin/python --reinstall --find-links dist jsonatapy pytest pytest-xdist
          .venv/bin/python -c "import jsonatapy; print(f'jsonatapy {jsonatapy.__version__} installed successfully')"

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/python/ \
            --ignore=tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            -n auto

      - name: Run reference suite (smoke test)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          .venv/bin/python -m pytest tests/python/test_reference_suite.py \
            -v \
            --tb=short \
            --maxfail=10 \
            -k "array-constructor"

  publish-macos-wheel:
    name: Publish macOS wheel to PyPI and attach to release
    runs-on: ubuntu-latest
    needs: test-macos-wheel
    timeout-minutes: 15
    # This project publishes via PyPI Trusted Publishing (OIDC) exclusively -
    # there is no stored PYPI_API_TOKEN secret. Trusted Publishing is
    # registered per-workflow-filename on pypi.org, so this workflow needs
    # its own entry there (owner=txjmb, repo=jsonata-core,
    # workflow=release-macos-backfill.yml, environment=pypi) in addition to
    # release.yml's existing one.
    environment:
      name: pypi
      url: https://pypi.org/project/jsonatapy/

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-macOS-aarch64-apple-darwin
          path: dist

      - name: List distribution files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

      - name: Attach wheel to existing GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
